<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" type="text/css" />

    <link rel="stylesheet" href="styles.css" type="text/css" />
    <title>HomeWork12</title>
  </head>
  <body>
    <h1>SVG</h1>
    <header>
      <ul>
        <li>dfg</li>
        <li>dfg</li>
        <li>dfg</li>
        <li>dgf</li>
      </ul>
    </header>
    <!-- Квадрат -->
    <section class="homework12">
      <div class="rect">
        <svg width="100" height="100">
          <rect
            width="50"
            height="50"
            style="
              fill: red;
              stroke-width: 10;
              stroke: rgb(13, 12, 12);
              opacity: 0.4;
            "
          />
        </svg>
      </div>

      <!-- Круг -->
      <div class="circle">
        <svg width="250" height="250">
          <circle
            fill="blue"
            r="30"
            cy="50"
            cx="50"
            style="stroke: rgb(216, 10, 154); stroke-width: 5"
          ></circle>
        </svg>
      </div>

      <div class="text">
        <!-- Текст -->
        <svg height="210" width="500">
          <text
            x="50"
            y="50"
            style="
              font-family: 'Times New Roman', Times, serif;
              font-size: 50px;
              fill: rgb(80, 22, 179);
            "
          >
            Hello SVG
          </text>
        </svg>
      </div>

      <div class="line">
        <!-- линия -->
        <svg height="300" width="200">
          <line
            x1="0"
            y1="100"
            x2="200"
            y2="100"
            style="stroke: rgb(139, 27, 27); stroke-width: 5"
          />
        </svg>
      </div>

      <!-- Еллипс -->
      <div class="ellipse">
        <svg width="300" hight="300">
          <ellipse
            cx="50"
            cy="50"
            rx="40"
            ry="20"
            fill="yellow"
            style="stroke: rgb(130, 130, 145); stroke-width: 5"
          ></ellipse>
        </svg>
      </div>
    </section>
    <section>sdgsdfgfg</section>
  </body>
</html>
